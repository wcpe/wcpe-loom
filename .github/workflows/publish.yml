name: CI

# 触发规则：
# 1. 推送到 dev/1.17-wcpe（仅代码变更）→ 构建 + 发布开发版（版本号 1.17-dev.<运行号>），
#    并更新开发线指针 1.17-dev-latest
# 2. 打 wcpe-v 开头的 tag → 发布该 tag 指定的正式版（如 wcpe-v1.17.1 → 1.17.1），
#    更新稳定线指针 1.17-latest，并创建 GitHub Release。
#    说明：这里不用 v* 前缀，因为上游 fabric-loom 已占用大量 v1.17.* 的 release tag，
#    同名 tag 在本仓库内不可复用。
# 3. 纯文档修改（README/CHANGELOG/docs/**）不触发任何构建
on:
  push:
    branches:
      - dev/1.17-wcpe
    tags:
      - 'wcpe-v*'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '**.md'

permissions:
  contents: read
  # 正式版运行需要取消同一提交上仍在进行的开发版构建
  actions: write

# 同一次推送若同时涉及分支与 tag（先推代码、再打正式版 tag 是标准流程），
# 两个事件会各触发一次完整构建，等于把同一个提交构建两遍。
# 注意：不能靠按提交 SHA 归并并发组来解决——cancel-in-progress 由「后进入的运行」决定，
# 正式版运行若设为不取消他人，就只能排队等开发版构建跑完（实测会白白多等一整轮）。
# 因此这里按 ref 分组：同一分支的连续推送互相取代，正式版各占一组，永不被分支事件取消或阻塞；
# 跨 ref 的去重改由正式版运行主动取消同一提交的其它运行（见下一步）。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # 单作业超时。GitHub 默认是 6 小时——曾有一个用例在内层 Gradle daemon OOM 后挂死，
    # 把整条工作流拖到 361 分钟才被上限杀掉。这里按实测耗时给足余量后显式封顶。
    timeout-minutes: 75
    outputs:
      is-release: ${{ steps.meta.outputs.is-release }}
      release-version: ${{ steps.meta.outputs.release-version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 配置 JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: 验证 Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: 判断构建类型
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/wcpe-v* ]]; then
            # 正式版：打 tag 发布，版本号取 tag 名去掉 wcpe-v 前缀（如 wcpe-v1.17.1 → 1.17.1）
            VERSION="${GITHUB_REF#refs/tags/wcpe-v}"
            echo "is-release=true" >> "$GITHUB_OUTPUT"
            echo "release-version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
          else
            # 代码推送：发布开发版 1.17-dev.<运行号>，与正式版 1.17.<N> 分属不同命名空间；
            # 运行号单调递增，天然满足产物不可覆盖的要求
            VERSION="1.17-dev.${GITHUB_RUN_NUMBER}"
            echo "is-release=false" >> "$GITHUB_OUTPUT"
            echo "release-version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 判断该提交是否已是正式版
        id: guard
        shell: bash
        run: |
          # 正式版运行自身不跳过；分支推送若指向已带 wcpe-v* tag 的提交，则不再重复构建开发版
          if [[ "${GITHUB_REF_TYPE}" == "branch" ]] && git tag --points-at HEAD | grep -q '^wcpe-v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "该提交已带正式版 tag，跳过开发版构建"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 取消同一提交上仍在进行的其它运行
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 先推代码、再打 tag 是标准流程：分支推送会先启动一次开发版构建，
          # 正式版运行在这里取消它，避免同一个提交被完整构建两遍。
          # 反向顺序（tag 先到、分支事件后到）由上一步「已是正式版」的判断兜底。
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA" --status in_progress \
              --json databaseId --jq '.[].databaseId'); do
            if [ "$id" != "$GITHUB_RUN_ID" ]; then
              echo "取消同一提交的其它运行: $id"
              gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
            fi
          done

      - name: 发布前选定回归门禁
        if: steps.guard.outputs.skip != 'true'
        run: |
          ./gradlew test \
            --tests net.fabricmc.loom.test.integration.RemapTaskCacheTest \
            --tests net.fabricmc.loom.test.integration.ConfigurationCacheTest \
            --tests net.fabricmc.loom.test.integration.forge.ForgeRunConfigTest \
            --tests net.fabricmc.loom.test.integration.forge.ForgeTest \
            --tests net.fabricmc.loom.test.integration.forge.AccessTransformerTest \
            --tests net.fabricmc.loom.test.integration.forge.PatchedDecompileTest \
            --tests net.fabricmc.loom.test.integration.forge.legacy.LegacyForgeExternalModDependencyTest \
            --tests net.fabricmc.loom.test.integration.pipeline.* \
            --tests net.fabricmc.loom.test.unit.AsyncCacheTest \
            --tests net.fabricmc.loom.test.unit.AsyncZipProcessorTest \
            --tests net.fabricmc.loom.test.unit.cache.AtomicFilesTest \
            --tests net.fabricmc.loom.test.unit.cache.CachedDataTest \
            --tests net.fabricmc.loom.test.unit.cache.CachedFileStoreTest \
            --tests net.fabricmc.loom.test.unit.cache.CacheEntryLockTest \
            --tests net.fabricmc.loom.test.unit.service.MappingsServiceTest \
            --no-daemon --stacktrace --warning-mode fail
        env:
          CI: true
          RELEASE_VERSION: ${{ steps.meta.outputs.release-version }}

      - name: 上传缓存回归失败报告
        if: failure() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: remap-cache-test-results
          path: |
            build/reports/tests/test/
            build/test-results/test/

      - name: 构建并发布
        if: steps.guard.outputs.skip != 'true'
        run: ./gradlew build publish exportVersion -x test --no-daemon --stacktrace
        env:
          CI: true
          RELEASE_VERSION: ${{ steps.meta.outputs.release-version }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is-prerelease }}
          PUBLISH_LATEST: ${{ steps.meta.outputs.is-prerelease == 'true' && 'dev' || 'stable' }}
          ORG_GRADLE_PROJECT_wcpeUsername: ${{ secrets.WCPE_USERNAME }}
          ORG_GRADLE_PROJECT_wcpePassword: ${{ secrets.WCPE_PASSWORD }}

  # 正式版发布后创建 GitHub Release（仅 tag 触发）
  release:
    needs: build
    if: needs.build.outputs.is-release == 'true'
    runs-on: ubuntu-24.04
    # 单作业超时。GitHub 默认是 6 小时——曾有一个用例在内层 Gradle daemon OOM 后挂死，
    # 把整条工作流拖到 361 分钟才被上限杀掉。这里按实测耗时给足余量后显式封顶。
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # 生成变更清单要遍历 PREV_TAG..TAG 的提交，fetch-depth=1 拿不到历史
          fetch-depth: 0
          # 推导上一版 tag 需要本地有 wcpe-v* 标签
          fetch-tags: true

      - name: 创建 GitHub Release（按提交生成变更清单）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        # 不用 `--generate-notes`：它只统计**经 PR 合入**的提交，而本仓库以直推为主，
        # 结果是正文全空（一条 PR 都没有时）或只剩零星几条 PR、同版本其它提交全丢，
        # 且同一批 PR 会在相邻版本里反复出现。改为由 scripts/gen-release-notes.sh 按提交生成，
        # 直推与 PR 合入一视同仁，按 Conventional Commits 的 type 分组。
        # 标题统一为「WCPE Loom <版本号>」；重跑或重复推送同一 tag 时保留现有 Release，
        # 避免 gh release create 返回 422。
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG_NAME 已存在，跳过重复创建"
            exit 0
          fi

          # 上一个 wcpe-v* 正式版 tag，作为变更区间的起点
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'wcpe-v*' "${TAG_NAME}^")"
          echo "变更区间: ${PREV_TAG}..${TAG_NAME}"

          # wcpe-v1.17.8 → 1.17.8
          VERSION="${TAG_NAME#wcpe-v}"

          NOTES_FILE="$(mktemp)"
          bash scripts/gen-release-notes.sh "${PREV_TAG}" "${TAG_NAME}" > "${NOTES_FILE}"
          echo "--- 生成的变更清单 ---"
          cat "${NOTES_FILE}"

          if gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WCPE Loom ${VERSION}" \
            --notes-file "${NOTES_FILE}"; then
            :
          elif gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 并发运行可能在检查后、创建前由另一运行先创建；仅在确认 Release 已存在时视为成功。
            echo "::notice::Release $TAG_NAME 已由并发运行创建"
            exit 0
          else
            exit 1
          fi
