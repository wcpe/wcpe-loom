name: CI

# 两种触发：
# 1. 推送到 main → 构建并发布开发预发布版（1.17-wcpe-dev-latest）
# 2. 打 v 开头的 tag → 构建并发布正式版 + 创建 GitHub Release（带 CHANGELOG）
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      is-release: ${{ steps.meta.outputs.is-release }}
      release-version: ${{ steps.meta.outputs.release-version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 配置 JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: 验证 Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: 判断构建类型
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "is-release=true" >> "$GITHUB_OUTPUT"
            echo "release-version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is-release=false" >> "$GITHUB_OUTPUT"
            echo "release-version=1.17-wcpe-dev-latest" >> "$GITHUB_OUTPUT"
            echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并发布
        run: ./gradlew build publish -x test --no-daemon --stacktrace
        env:
          CI: true
          RELEASE_VERSION: ${{ steps.meta.outputs.release-version }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is-prerelease }}
          ORG_GRADLE_PROJECT_wcpeUsername: ${{ secrets.WCPE_USERNAME }}
          ORG_GRADLE_PROJECT_wcpePassword: ${{ secrets.WCPE_PASSWORD }}

  # 正式版发布后创建 GitHub Release（仅 tag 触发）
  release:
    needs: build
    if: needs.build.outputs.is-release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 提取 CHANGELOG
        id: changelog
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.release-version }}"
          # 从 CHANGELOG.md 提取对应版本的段落（## <version> 到下一个 ## 之间）
          BODY=$(awk -v ver="$VERSION" '
            /^## / { if (found) exit; if ($2 == ver) found=1; next }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="发布版本 $VERSION"
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: fabric-loom ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
