name: Run Tests
on:
  push:
    branches:
      - dev/1.17-wcpe
    # 显式排除所有 tag。本仓库的 patch-queue/<线> 是可移动的队列标记 tag，每次插入补丁
    # 都会 force-push 前移一次；wcpe-v* 正式版 tag 的发布由 publish.yml 负责。
    # 上游原版此处为 `on: push`（无过滤），会匹配一切 ref，导致每次前移队列标记都白跑
    # 一轮完整测试（实测约 40 分钟）。注意此文件随补丁队列一起被重放，tag 推送触发时
    # GitHub 读取的正是本提交上的版本，故修正必须落在队列内。
    tags-ignore:
      - '**'
    # 纯文档推送不跑测试：与 publish.yml 的 paths-ignore 对齐，
    # 避免一行 README 改动就白跑一轮约 30 分钟的完整测试。
    # 仅作用于 push 触发，PR 仍照常运行，以免分支保护要求的状态检查缺失。
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:
    inputs:
      extended_tests:
        description: 'Extended tests'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - run: ./gradlew build check -x test --stacktrace --warning-mode fail
      - uses: Juuxel/publish-checkstyle-report@v3
        if: ${{ failure() }}
        with:
          reports: |
            build/reports/checkstyle/*.xml
            build/reports/codenarc/*.xml

  build_windows:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.extended_tests == 'true' }}

    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - uses: gradle/actions/wrapper-validation@v6
      - run: ./gradlew build check -x test --stacktrace --warning-mode fail

  # This job is used to feed the test matrix of next job to allow the tests to run in parallel
  prepare_test_matrix:
    # Lets wait to ensure it builds before going running tests
    needs: build

    runs-on: ubuntu-24.04

    steps:
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - uses: actions/checkout@v6
      - run: ./gradlew writeActionsTestMatrix --stacktrace --warning-mode fail
      -
        id: set-matrix
        run: echo "matrix=$(cat build/test_matrix.json)" >> $GITHUB_OUTPUT

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  run_tests:
    needs: prepare_test_matrix

    strategy:
      fail-fast: false
      # TestKit 各矩阵任务共享外部 Maven 仓库，限制并发以降低集中下载触发 403/runner 失联的概率。
      max-parallel: 6
      matrix:
        test: ${{ fromJson(needs.prepare_test_matrix.outputs.matrix) }}

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      # TestKit 使用 .gradle/test-files/integration/gradle_home，不是 runner 默认 Gradle User Home。
      - name: 缓存 TestKit Gradle 依赖
        uses: actions/cache@v6
        with:
          path: |
            .gradle/test-files/integration/gradle_home/caches/modules-2
            .gradle/test-files/integration/gradle_home/wrapper/dists
          key: ${{ runner.os }}-testkit-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', '**/*.gradle.kts', 'src/test/**') }}
          restore-keys: |
            ${{ runner.os }}-testkit-gradle-
      # Forge 自带的 ForgeFlower 反编译器不支持 JDK 25，需为 forge 系列测试准备 JDK 21（放在 25 之前，避免顶掉 JAVA_HOME）
      - name: setup jdk 21 (Forge tooling)
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - run: ./gradlew printActionsTestName --name="${{ matrix.test }}" test --tests ${{ matrix.test }} --stacktrace --warning-mode fail
        env:
          TEST_WARNING_MODE: fail
          EXTENDED_TESTS: ${{ github.event.inputs.extended_tests }}
        id: test

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ steps.test.outputs.test }} Results
          path: build/reports/
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ steps.test.outputs.test }} Heap Dump
          path: "*.hprof"

  run_tests_windows:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.extended_tests == 'true' }}

    needs: prepare_test_matrix

    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.prepare_test_matrix.outputs.matrix) }}

    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6
      # 同 run_tests：forge 系列测试的反编译步骤需要 JDK 21
      - name: setup jdk 21 (Forge tooling)
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - run: ./gradlew printActionsTestName --name="${{ matrix.test }}" test --tests ${{ matrix.test }} --stacktrace --warning-mode fail
        env:
          TEST_WARNING_MODE: fail
        id: test

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ steps.test.outputs.test }} Results (Windows)
          path: build/reports/
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ steps.test.outputs.test }} Heap Dump (Windows)
          path: "*.hprof"

  # Special case this test to run across all os's
  reproducible_build_test:
    needs: build

    strategy:
      fail-fast: false
      matrix:
        java: [ 21, 25 ]
        os: [ windows-2025, ubuntu-24.04, macos-26 ]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - run: ./gradlew test --tests *ReproducibleBuildTest --stacktrace --warning-mode fail

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: Reproducible Build ${{ matrix.os }} (${{ matrix.java }}) Results
          path: build/reports/
