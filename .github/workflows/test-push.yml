name: CI

env:
  # 只选择依赖下载源：默认 Google，可切换为 aliyun 或 official。
  WCPE_CI_MAVEN_CENTRAL: ${{ vars.WCPE_CI_MAVEN_CENTRAL || 'google' }}

# 唯一的构建工作流：测试矩阵 + 发布。
#
# 历史上这里是两个文件（test-push.yml 跑测试、publish.yml 跑发布），两者都对
# dev/1.17-wcpe 的 push 触发，于是每次推送都开两条流水线，各自重新 checkout、
# 装 JDK、装 Gradle，同一份提交被完整处理两遍。更严重的是两者互不知情——
# 实测 1.17-dev.167 就是在 Run Tests 失败（DecompileTest 下载超时）的情况下
# 照常发布出去的。
#
# 合并后：
#   · 分支推送 → 测试矩阵 → 发布开发版（**必须等测试通过**）
#   · tag 推送 → 直接发布正式版（矩阵只在分支上跑：该提交推到分支时已被测过，
#     打 tag 再跑一遍 78 个作业纯属浪费）
#
# 例外：**只动了 `scripts/` 下运维脚本的推送**只跑 `scripts` 作业（发布说明引擎的
# 回归），跳过 build 及其之后的测试矩阵与开发版发布。判据由 `detect` 作业计算，
# 拿不准时一律跑全量。注意 `**.md` 已经在 paths-ignore 里——纯文档改动根本不触发。
on:
  push:
    branches:
      - dev/1.17-wcpe
    tags:
      - 'wcpe-v*'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:
    inputs:
      extended_tests:
        description: 'Extended tests'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  # 注：合并后不再有「正式版运行取消分支运行」那一步——单个工作流里同一 ref 的
  # 并发已由 concurrency 处理，跨 ref 的重复由 publish 的 guard（提交已带 tag 则跳过
  # 开发版）兜底，因此这里不再需要 actions: write。

# 同一分支的连续推送互相取代；正式版各占一组，避免被分支事件取消。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 本作业只读取打包分支中的补丁数据，不运行打包分支代码。
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 发布说明引擎回归测试
        run: bash scripts/tests/gen-release-notes-test.sh
      - name: quilt 队列校验回归测试
        run: python3 -I -B scripts/tests/verify-quilt-view-test.py
      # PR 的临时合并提交不是发布视图；真正的推送、验证或标签查实际 SHA。
      - name: 核对构建视图来自标准补丁队列
        if: github.repository == 'wcpe/wcpe-loom' && github.event_name != 'pull_request'
        run: |
          git fetch --no-tags origin refs/heads/debian/1.17:refs/remotes/origin/debian/1.17
          bash scripts/sync-upstream.sh verify

  # 判断本次推送是否「只动了 scripts/ 下的运维脚本」。
  #
  # 动机：paths-ignore 只能整条工作流一起跳过，而 scripts/ 里的东西既不该完全不测
  # （`scripts` 作业要跑发布说明引擎的回归），也不该为一个纯 bash 改动拉起 78 个集成
  # 测试作业并发布一份 1.17-SNAPSHOT。所以这里算出「纯脚本改动」，让下游的 build
  # 及其之后的作业整体跳过，只留 scripts 作业。
  #
  # 判据刻意保守：任何拿不准的情形（非 push、新分支 before 全零、改动为空、force push
  # 后两点不可比）都返回 false，也就是**照常跑全量**。宁可多跑一次，不可漏测。
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scripts-only: ${{ steps.filter.outputs.scripts-only }}
    steps:
      - uses: actions/checkout@v6
        with:
          # 需要 base..head 的两端点，浅克隆取不到 base。
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            echo "scripts-only=false" >> "$GITHUB_OUTPUT"
            echo "非 push 事件，跑全量"
            exit 0
          fi
          base="${GITHUB_EVENT_BEFORE:-}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            echo "scripts-only=false" >> "$GITHUB_OUTPUT"
            echo "base 为空或全零（新分支/首次推送），跑全量"
            exit 0
          fi
          # 用 --no-renames 保持直白：改名会同时出现删除与新增两条路径，仍落在 scripts/ 下。
          changed="$(git diff --name-only --no-renames "${base}" "${GITHUB_SHA}" || true)"
          if [[ -z "${changed}" ]]; then
            echo "scripts-only=false" >> "$GITHUB_OUTPUT"
            echo "改动集为空（空提交或 base 不可比），跑全量"
            exit 0
          fi
          echo "本次改动文件："
          printf '%s\n' "${changed}" | sed 's/^/  /'
          if printf '%s\n' "${changed}" | grep -qv '^scripts/'; then
            echo "scripts-only=false" >> "$GITHUB_OUTPUT"
            echo "含 scripts/ 之外的改动，跑全量"
          else
            echo "scripts-only=true" >> "$GITHUB_OUTPUT"
            echo "只动了 scripts/，跳过 build 及之后的测试矩阵与发布"
          fi

  build:
    needs: detect
    # 纯 scripts/ 改动不编译、不测矩阵、不发快照：它碰不到 Java/Groovy 产物。
    # 下游（prepare_test_matrix / run_tests / reproducible_build_test / publish / release）
    # 都以 build 为 needs，这里跳过会顺着 needs 级联，无需逐个加条件。
    if: ${{ needs.detect.outputs.scripts-only != 'true' }}
    runs-on: ubuntu-24.04
    # 单作业超时。GitHub 默认是 6 小时——曾有一个用例在内层 Gradle daemon OOM 后挂死，
    # 把整条工作流拖到 361 分钟才被上限杀掉。这里按实测耗时给足余量后显式封顶。
    timeout-minutes: 30
    steps:
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      # 本作业是整条流水线的第一个 Gradle 消费者，也是外层 Gradle User Home 缓存的
      # **唯一写入者**。必须能写：缓存不存在时若全链路只读，这份缓存永远是空的。
      # （run_tests / publish 里都设了 cache-read-only: true，只读不写。）
      - name: 配置 Gradle（外层依赖缓存，负责播种）
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - run: ./gradlew build check -x test --stacktrace --warning-mode fail
      - uses: Juuxel/publish-checkstyle-report@v3
        if: ${{ failure() }}
        with:
          reports: |
            build/reports/checkstyle/*.xml
            build/reports/codenarc/*.xml

  build_windows:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.extended_tests == 'true' }}

    runs-on: windows-2025
    # 单作业超时。GitHub 默认是 6 小时——曾有一个用例在内层 Gradle daemon OOM 后挂死，
    # 把整条工作流拖到 361 分钟才被上限杀掉。这里按实测耗时给足余量后显式封顶。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
      - uses: gradle/actions/wrapper-validation@v6
      - run: ./gradlew build check -x test --stacktrace --warning-mode fail

  # This job is used to feed the test matrix of next job to allow the tests to run in parallel
  prepare_test_matrix:
    # Lets wait to ensure it builds before going running tests
    needs: build
    # tag 推送不跑矩阵：该提交推到分支时已被测过
    if: github.ref_type != 'tag'

    runs-on: ubuntu-24.04
    # 单作业超时。GitHub 默认是 6 小时——曾有一个用例在内层 Gradle daemon OOM 后挂死，
    # 把整条工作流拖到 361 分钟才被上限杀掉。这里按实测耗时给足余量后显式封顶。
    timeout-minutes: 15

    steps:
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
      - uses: actions/checkout@v6
      - name: 配置 Gradle（只读缓存）
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - run: ./gradlew writeActionsTestMatrix --stacktrace --warning-mode fail
      -
        id: set-matrix
        run: echo "matrix=$(cat build/test_matrix.json)" >> $GITHUB_OUTPUT

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  run_tests:
    needs: prepare_test_matrix
    if: github.ref_type != 'tag'

    strategy:
      fail-fast: false
      # 限制并发的原意是「TestKit 各矩阵任务共享外部 Maven 仓库，限制并发以降低集中下载
      # 触发 403/runner 失联的概率」。但那是缓存缺位时的判断：现在依赖与 MC 产物都走缓存，
      # 命中后基本不再打外部仓库，403 风险大幅下降。
      # 实测 66 个作业串行总时长 299 分钟，6 路并发即约 50 分钟墙钟；提到 12 路约 25 分钟。
      max-parallel: 12
      matrix:
        test: ${{ fromJson(needs.prepare_test_matrix.outputs.matrix) }}

    runs-on: ubuntu-24.04
    # 单作业超时。GitHub 默认是 6 小时——曾有一个用例在内层 Gradle daemon OOM 后挂死，
    # 把整条工作流拖到 361 分钟才被上限杀掉。这里按实测耗时给足余量后显式封顶。
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
      # 外层 Gradle User Home（wrapper 发行版 + 插件依赖）。
      #
      # 本工作流有约 78 个矩阵作业，每个都在全新 runner 上跑。此前**完全没有**这一层缓存，
      # 意味着每个作业都要重新下载 Gradle 9.5.0-all 发行版（约 200MB）与全部插件依赖，
      # 78 个作业就是同一份东西重复下载 78 次——这是「测试为什么那么久」的主因。
      #
      # 注意与下方 TestKit 缓存的分工：那一份管的是**内层** TestKit 构建的 gradle_home，
      # 这一份管的是**外层**跑 ./gradlew 的那个 Gradle User Home，两者互不覆盖。
      - name: 配置 Gradle（外层依赖与构建缓存）
        uses: gradle/actions/setup-gradle@v5
        with:
          # 只读：78 个矩阵作业都去写同一份缓存纯属浪费——每个作业在结束前都要打包上传，
          # 而 GitHub 对已存在的 key 会拒绝保存。写入统一交给下方指定的那个测试作业。
          cache-read-only: true
      # TestKit 的内层构建用 .gradle/test-files/integration/gradle_home 作为 Gradle User Home，
      # 不是 runner 默认的那个。这里缓存三部分：
      #
      #   modules-2        依赖构件
      #   wrapper/dists    内层 Gradle 发行版
      #   fabric-loom/minecraftMaven  Loom 解析/重映射后的 MC 产物（remapped jar、映射表）
      #
      # 只取 minecraftMaven 而不是整个 fabric-loom：后者本地实测 11GB（含 assets 1.5GB
      # 与各版本工作目录 4.9GB），超过 GitHub 单仓库 10GB 的缓存上限，存进去会被 LRU
      # 立刻挤掉。minecraftMaven 3.9GB，正是重映射产物本身，复用价值最高。
      #
      # 恢复（只读）与写入分开：78 个矩阵作业各自在结束前打包上传 4GB 是纯浪费，
      # 且 GitHub 对已存在的 key 会直接拒绝。因此绝大多数作业只 restore，
      # 由单个指定作业负责写入（见下一个步骤）。
      - name: 恢复 TestKit 缓存（只读）
        if: strategy.job-index != 0
        uses: actions/cache/restore@v6
        with:
          path: |
            .gradle/test-files/integration/gradle_home/caches/modules-2
            .gradle/test-files/integration/gradle_home/wrapper/dists
            .gradle/test-files/integration/gradle_home/caches/fabric-loom/minecraftMaven
          key: ${{ runner.os }}-testkit-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', '**/*.gradle.kts', 'src/test/**') }}
          restore-keys: |
            ${{ runner.os }}-testkit-gradle-

      # 唯一负责写 TestKit 缓存的作业：取矩阵第 0 项。
      #
      # 刻意不用 `matrix.test == '<某个具体类名>'`：那样一旦矩阵生成逻辑变化
      # （比如该类被并入某个前缀组），条件永远不匹配，缓存会**静默停止更新**且
      # 不会报任何错。job-index 是位置判据，与矩阵内容无关，永远恰好一个作业命中。
      - name: 恢复并写入 TestKit 缓存
        if: strategy.job-index == 0
        uses: actions/cache@v6
        with:
          path: |
            .gradle/test-files/integration/gradle_home/caches/modules-2
            .gradle/test-files/integration/gradle_home/wrapper/dists
            .gradle/test-files/integration/gradle_home/caches/fabric-loom/minecraftMaven
          key: ${{ runner.os }}-testkit-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', '**/*.gradle.kts', 'src/test/**') }}
          restore-keys: |
            ${{ runner.os }}-testkit-gradle-
      # Forge 自带的 ForgeFlower 反编译器不支持 JDK 25，需为 forge 系列测试准备 JDK 21（放在 25 之前，避免顶掉 JAVA_HOME）
      - name: setup jdk 21 (Forge tooling)
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
      # 测试作业仍用 JDK 25：部分用例的内层构建要求 --release 25（如 noRemap.UnobfFabricAPITest 的 fabric-api），
      # 降到 21 会直接编译失败。构建类作业用 21 是为了对齐发布运行时并守住 javadoc 一类问题。
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - run: ./gradlew printActionsTestName --name="${{ matrix.test }}" test --tests "${{ matrix.test }}" --stacktrace --warning-mode fail
        env:
          TEST_WARNING_MODE: fail
          EXTENDED_TESTS: ${{ github.event.inputs.extended_tests }}
        id: test

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ steps.test.outputs.test }} Results
          path: build/reports/
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ steps.test.outputs.test }} Heap Dump
          path: "*.hprof"

  run_tests_windows:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.extended_tests == 'true' }}

    needs: prepare_test_matrix

    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.prepare_test_matrix.outputs.matrix) }}

    runs-on: windows-2025
    # 单作业超时。GitHub 默认是 6 小时——曾有一个用例在内层 Gradle daemon OOM 后挂死，
    # 把整条工作流拖到 361 分钟才被上限杀掉。这里按实测耗时给足余量后显式封顶。
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
      # 同 run_tests：forge 系列测试的反编译步骤需要 JDK 21，而测试本身仍要求 JDK 25
      - name: setup jdk 21 (Forge tooling)
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - run: ./gradlew printActionsTestName --name="${{ matrix.test }}" test --tests "${{ matrix.test }}" --stacktrace --warning-mode fail
        env:
          TEST_WARNING_MODE: fail
        id: test

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ steps.test.outputs.test }} Results (Windows)
          path: build/reports/
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ steps.test.outputs.test }} Heap Dump (Windows)
          path: "*.hprof"

  # Special case this test to run across all os's
  reproducible_build_test:
    needs: build
    if: github.ref_type != 'tag'

    strategy:
      fail-fast: false
      matrix:
        # 保留 JDK 25 作为额外兼容矩阵，验证 21/25 两个运行时产出的可复现性一致
        java: [ 21, 25 ]
        os: [ windows-2025, ubuntu-24.04, macos-26 ]

    runs-on: ${{ matrix.os }}
    # 单作业超时。GitHub 默认是 6 小时——曾有一个用例在内层 Gradle daemon OOM 后挂死，
    # 把整条工作流拖到 361 分钟才被上限杀掉。这里按实测耗时给足余量后显式封顶。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: 配置 Gradle（只读缓存）
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - run: ./gradlew test --tests "*ReproducibleBuildTest" --stacktrace --warning-mode fail

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: Reproducible Build ${{ matrix.os }} (${{ matrix.java }}) Results
          path: build/reports/

  # 发布：分支推送发开发版，tag 推送发正式版。
  #
  # 与测试矩阵合并到同一工作流后，发布可以直接 needs 测试结论——不再存在
  # 「Run Tests 失败、CI 照常发布」的时间窗（1.17-dev.167 就是这么发出去的）。
  publish:
    needs: [build, run_tests, reproducible_build_test]
    # 分支：三个前置都成功才发布；tag：矩阵被上面的 if 跳过，只要求 build 成功。
    # 用 !cancelled() 而不是 always()：被取消的运行不该继续发布。
    # 必须限定 event_name == 'push'：PR 的 github.ref_type 也是 'branch'，不限定会在
    # PR 上尝试发布（凭据缺失且语义错误）。
    if: |
      !cancelled() && github.event_name == 'push' && needs.build.result == 'success' &&
      (github.ref_type == 'tag' ||
       (needs.run_tests.result == 'success' && needs.reproducible_build_test.result == 'success'))
    runs-on: ubuntu-24.04
    # 门禁瘦身后只跑单元测试（原 48 分钟 → 约 3 分钟），75 分钟的旧余量已无必要。
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 配置 JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/wrapper-validation@v6

      - name: 配置 Gradle（依赖与构建缓存）
        uses: gradle/actions/setup-gradle@v5
        with:
          # 只读：缓存的写入交给测试矩阵里那个指定作业，本作业不需要重复上传。
          cache-read-only: true

      - name: 判断构建类型
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/wcpe-v* ]]; then
            # 正式版：版本号取 tag 名去掉 wcpe-v 前缀（wcpe-v1.17.1 → 1.17.1）
            VERSION="${GITHUB_REF#refs/tags/wcpe-v}"
            echo "is-release=true" >> "$GITHUB_OUTPUT"
            echo "release-version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
            echo "publish-latest=stable" >> "$GITHUB_OUTPUT"
          else
            # 开发版：直接用 1.17-SNAPSHOT。SNAPSHOT 是 Maven 里唯一允许“同版本号换内容”的形态，
            # 正好对应开发线语义；Nexus 会按快照保留策略自动清理旧时间戳构件，
            # 因此不再占 1.17-dev.<运行号> 那种不可回收的固定版号。
            echo "is-release=false" >> "$GITHUB_OUTPUT"
            echo "release-version=1.17-SNAPSHOT" >> "$GITHUB_OUTPUT"
            echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
            # 开发版不更新任何指针（它的版本号本身就是 SNAPSHOT）。
            # 必须留空而不是用 `A && '' || 'stable'` 的写法：空字符串在 GitHub 表达式里是 falsy，
            # 那个写法永远得到 'stable'，会让开发版错盖稳定线指针 1.17-latest。
            echo "publish-latest=" >> "$GITHUB_OUTPUT"
          fi

      - name: 判断该提交是否已是正式版
        id: guard
        shell: bash
        run: |
          # 正式版运行自身不跳过；分支推送若指向已带 wcpe-v* tag 的提交，则不再重复构建开发版
          if [[ "${GITHUB_REF_TYPE}" == "branch" ]] && git tag --points-at HEAD | grep -q '^wcpe-v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "该提交已带正式版 tag，跳过开发版构建"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 只跑单元测试：集成测试的权威结论由上面的矩阵给出（同一工作流、同一提交、已并行跑完），
      # 在这里重跑同一批用例既慢又无法提供额外保障。PatchedDecompileTest 单独要 8 分 46 秒，
      # 验证的是反编译产物正确性，与「能否发布」无关。
      - name: 发布前冒烟（单元测试）
        if: steps.guard.outputs.skip != 'true'
        run: ./gradlew test --tests "net.fabricmc.loom.test.unit.*" --build-cache --no-daemon --stacktrace --warning-mode fail
        env:
          CI: true
          RELEASE_VERSION: ${{ steps.meta.outputs.release-version }}

      - name: 上传发布前冒烟的失败报告
        if: failure() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: publish-smoke-test-results
          path: |
            build/reports/tests/test/
            build/test-results/test/

      - name: 构建并发布
        if: steps.guard.outputs.skip != 'true'
        # --build-cache：命中时直接复用矩阵作业产出的编译/jar 等任务产物
        run: ./gradlew build publish exportVersion -x test --build-cache --no-daemon --stacktrace
        env:
          CI: true
          RELEASE_VERSION: ${{ steps.meta.outputs.release-version }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is-prerelease }}
          # 由 meta 步骤直接给出：正式版 stable，开发版空。
          PUBLISH_LATEST: ${{ steps.meta.outputs.publish-latest }}
          ORG_GRADLE_PROJECT_wcpeUsername: ${{ secrets.WCPE_USERNAME }}
          ORG_GRADLE_PROJECT_wcpePassword: ${{ secrets.WCPE_PASSWORD }}

  # 正式版发布后创建 GitHub Release（仅 tag 触发）
  #
  # 发布说明唯一的来源是仓库里的 `.upstream/releases/<tag>.md`，它与发版提交一同进 tag。
  # 清单由已提交的补丁标识按集合差生成，也兼容早期标签不在主线祖先链上的历史。
  # 当前默认分支只快进，清单仍在打 tag 前审阅并提交，让重跑使用同一份正文。
  release:
    needs: publish
    # 作业级 if 只判「publish 成功且未被取消」，**不在 github 表达式里判 tag**。
    #
    # 历史教训（f2492d58，2026-10-27）：原来用 needs.publish.outputs.is-release，
    # 改成 github.ref_type == 'tag' 之后，1.17.16 与 1.17.17 两次 tag 发布的 release
    # 作业都是 skipped（1.17.15 及更早是 success），两个版本的 Release 都只能事后手动补建。
    # 对照同一工作流里 publish 的 if：它能成功执行只能是因为 ref_type 判成了 'tag'
    # （另一支路要求 run_tests 与 reproducible_build_test 都 success，而它们在 tag 上被 skip），
    # 所以问题不在 ref_type 本身，而在“把 tag 判定放在作业级 if 里”这个做法不够稳。
    #
    # 改成：作业级只留 !cancelled()，真正的 tag 判定下沉到 step 里用 GITHUB_REF 前缀，
    # 与 publish 的“判断构建类型”步骤同一判据（那里已实测可靠，发布出的就是 1.17.17）。
    # 非 tag 运行时该 step 直接跳过，不会误建 Release。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 确认这是正式版 tag 触发
        id: tagguard
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/wcpe-v* ]]; then
            echo "is-tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-tag=false" >> "$GITHUB_OUTPUT"
            echo "::notice::非正式版 tag（GITHUB_REF=${GITHUB_REF}），不创建 Release"
          fi

      - name: 检出代码
        if: steps.tagguard.outputs.is-tag == 'true'
        uses: actions/checkout@v6
        with:
          # `gen-release-notes.sh --check` 要重算 BASE..TAG 区间内的全部补丁提交，
          # fetch-depth=1 只拿得到一个提交，历史缺失会让校验直接失败。
          fetch-depth: 0
          # 校验同时要按版本号顺序找上一个 wcpe-v* tag，并把基底 tag
          # （base/architectury-*）当作区间左端，所以标签必须一并取全。
          fetch-tags: true

      - name: 确认 Release 尚未创建
        id: existing
        if: steps.tagguard.outputs.is-tag == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # 存在性判断放在清单校验**之前**：1.17.19 及更早的版本没有落盘清单，
          # 重跑旧 tag 的流水线时应在这一步跳过，而不是因为「缺清单」把运行判红。
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG_NAME 已存在，跳过重复创建"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 校验发布清单已随 tag 提交
        id: notes
        if: steps.tagguard.outputs.is-tag == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # 清单必须**随 tag 一起提交**，不在 CI 里现场生成：
          #   · 确定性——同一 tag 永远对应同一份说明，重跑流水线不会换个正文；
          #   · 可审阅——发版前就能在提交/PR 里看到正文，事后还能 git log 追溯；
          #   · 零拓扑依赖——CI 只读一个文件，无需知道补丁队列这次又被重写成了什么形状。
          # 旧机制按 PREV..CURR 提交区间现算，而插补丁会重写历史、让上一版 tag 脱离祖先链，
          # 区间退回共同祖先，把上一版已发布的提交反复算进来（实测 78%~93% 是重复项）。
          # 改成按补丁面差集 + 清单固化后，顺带消灭了锚点表（release-anchors.txt）
          # 和「上一版换算到主线」那套逻辑。
          NOTES_FILE=".upstream/releases/${TAG_NAME}.md"
          if [ ! -f "${NOTES_FILE}" ]; then
            echo "::error::缺少发布清单 ${NOTES_FILE}。发版前请先在默认分支执行："
            echo "::error::  bash scripts/gen-release-notes.sh --tag ${TAG_NAME}"
            echo "::error::  然后 git add 并提交该文件，再打 tag。"
            exit 1
          fi
          # 不允许回退到旧的区间引擎：那正是本次要淘汰的东西。清单与重算结果不一致时
          # 宁可让运行失败、由人补齐，也不要让 CI 用另一套算法临时「猜」一份正文出来。
          # 失败显式转成 ::error::（而不是依赖 shell 的 -e）：报错信息落在注解里，
          # 在 Actions 页面上直接可读，不用翻日志才知道是不是清单过期了。
          if ! bash scripts/gen-release-notes.sh --check "${TAG_NAME}"; then
            echo "::error::发布清单 ${NOTES_FILE} 与当前 git 历史重算结果不一致（或校验器报错）。"
            echo "::error::请在默认分支重新执行：bash scripts/gen-release-notes.sh --tag ${TAG_NAME}"
            echo "::error::审阅改动后提交，并重新打 tag（已有 tag 需删除重建）。"
            exit 1
          fi
          echo "发布清单校验通过：${NOTES_FILE}"
          echo "notes-file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release（正文取自随 tag 提交的清单）
        if: steps.tagguard.outputs.is-tag == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.notes.outputs.notes-file }}
        # 不用 `--generate-notes`：它只统计经 PR 合入的提交，而本仓库以直推为主。
        run: |
          VERSION="${TAG_NAME#wcpe-v}"
          : "${NOTES_FILE:?发布清单路径为空，校验步骤未给出输出}"
          echo "--- 发布清单 ${NOTES_FILE} ---"
          cat "${NOTES_FILE}"

          if gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WCPE Loom ${VERSION}" \
            --notes-file "${NOTES_FILE}"; then
            :
          elif gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 并发跑的两条流水线都通过了上面的存在性检查，后到的那条会在这里撞车：
            # Release 已经被先到的创建好了，视为成功，不要判红。
            echo "::notice::Release $TAG_NAME 已由并发运行创建"
            exit 0
          else
            exit 1
          fi
