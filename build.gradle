import org.gradle.api.tasks.testing.logging.TestLogEvent
import org.gradle.util.GradleVersion
import org.w3c.dom.Document
import org.w3c.dom.Element
import org.w3c.dom.Node

publishing {
	repositories {
		// WCPE Maven 仓库（CI 发布写入 maven-releases）
		maven {
			name = 'WCPE'
			url = project.findProperty('wcpeMavenUrl') ?: 'https://maven.wcpe.top/repository/maven-releases/'
			credentials {
				username = project.findProperty('wcpeUsername')?.toString() ?: ''
				password = project.findProperty('wcpePassword')?.toString() ?: ''
			}
		}
	}

	publications { pubs ->
		if (!isSnapshot && !ENV.EXPERIMENTAL) {
			// 只保留稳定线的指针版本（随每次发布覆盖）：
			//   1.17-latest  —— 稳定线指针，仅正式版发布时更新
			//
			// 开发线不再需要额外指针：分支构建的主 version 本身就是 1.17-SNAPSHOT（版本号推导段），
			// 使用者写 1.17-SNAPSHOT 就是最新开发版。历史上这里还发 1.17-SNAPSHOT / 1.17-dev-latest
			// 两个指针，加上每次构建的 1.17-dev.<运行号> 固定版号；三者叠加导致仓库只增不减
			// （实测每个版本 5 个文件 6.86 MiB，含一份 3.4 MiB 的 javadoc.jar）。
			// 现在开发线只占一份 SNAPSHOT，由 Nexus 按快照保留策略自动清理旧时间戳构件。
			def extraVersions = [:]

			if (ENV.PUBLISH_LATEST == 'stable') {
				extraVersions[baseVersion + '-latest'] = 'latest'
			}

			def projectGroup = project.group
			def projectArtifactId = project.base.archivesName.get()
			def markerDependencyVersion = project.version.toString()

			extraVersions.each { extraVersion, name ->
				pubs.create(name, MavenPublication) { publication ->
					groupId = projectGroup
					artifactId = projectArtifactId
					version = extraVersion

					from components.java
				}

				gradlePlugin.plugins.forEach { plugin ->
					// Manually crate the plugin marker for the extra versions
					pubs.create(plugin.id + name.capitalize() + 'Marker', MavenPublication) { publication ->
						groupId = plugin.id
						artifactId = plugin.id + '.gradle.plugin'
						version = extraVersion

						pom.withXml({
							// Based off org.gradle.plugin.devel.plugins.MavenPluginPublishPlugin
							Element root = asElement()
							Document document = root.getOwnerDocument()
							Node dependencies = root.appendChild(document.createElement('dependencies'))
							Node dependency = dependencies.appendChild(document.createElement('dependency'))
							Node groupId = dependency.appendChild(document.createElement('groupId'))
							groupId.setTextContent(projectGroup)
							Node artifactId = dependency.appendChild(document.createElement('artifactId'))
							artifactId.setTextContent(projectArtifactId)
							Node version = dependency.appendChild(document.createElement('version'))
							version.setTextContent(markerDependencyVersion)
						})
					}
				}
			}
		}
	}

	repositories {
		if (ENV.MAVEN_PASS != null) {
			maven {
				url = "https://deploy.shedaniel.me/"
				credentials {
					username = "shedaniel"
					password = ENV.MAVEN_PASS
				}
			}
		}
	}
}

