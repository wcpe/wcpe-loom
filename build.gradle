// 开发线不发 javadoc.jar —— 仅限开发线，正式版仍然照旧发布它。
//
// javadoc 是单次发布里最大的单个文件（实测 3.4 MiB，占一次的 49%），而本仓库的使用方
// 是 mod 开发者，读文档看的是 sources.jar（IDE 内直接跳转），几乎不会去下载它。
// 开发线改成 SNAPSHOT 后每次推送都会产生一份快照，累计开销变得主导，所以不在开发线产出。
//
// **不能无条件关掉**：正式版 1.17.<N> 一旦发布就不可回收，其构件清单应当与历史各版一致
// （已核对 1.17.16 确实含 javadoc.jar）。若一并关掉，使用方的本地缓存或工具链里
// 假定的 classifier 可能在某次发版后突然缺失。
//
// 判据用 version 而不是 RELEASE_VERSION：后者只在发布 job 里被注入，本地构建不设置它，
// 而“本地构建是不是正式版”本质上就由 version 是否带 -SNAPSHOT/-PR 决定。
//
// 用 configureEach 而不是 named('javadocJar')：该任务由 java-gradle-plugin 在稍后注册，
// 在 java {} 块里用 named 会抛 “Task with name 'javadocJar' not found”。
// 注：:javadoc 任务本身仍然保留并参与 `check`，所以文档注释的语法错误照样会拦住 CI。
tasks.matching { it.name == 'javadocJar' }.configureEach { task ->
	def v = task.project.version.toString()
	task.enabled = !(v.endsWith('-SNAPSHOT') || v.contains('-dev.') || v.contains('-PR.'))
}

spotless {
	lineEndings = com.diffplug.spotless.LineEnding.UNIX

	// greclipse 的格式化器由 spotless 在首次使用时从 Eclipse 的 P2 仓库下载（不随插件分发，
	// 本地也没有任何缓存）。download.eclipse.org 整站会周期性返回「Temporary shutdown」页面
	// （HTTP 200 + HTML，而非 p2.index 文本），此时 spotless 报
	// "Failed to provision P2 dependencies: No match found"，并连带让 build 失败。
	//
	// 这里把官方源映射到镜像。默认用 Kakao 的 4.35 具体版本目录
	// （`updates/4.35` 本身是「组合仓库」，镜像通常只同步它的 p2.index，指向的
	// compositeContent.xml 缺失；`R-4.35-202502280140/` 才是完整的真实仓库）。
	// 不用清华 TUNA：它对非常用 UA（Gradle 的 okhttp）返回反爬拦截页，spotless 会把它
	// 当成 .xz 内容去解压，报 XZFormatException。可用
	//   -Ploom.eclipseP2Mirror=<可达的 P2 仓库根 URL>   覆盖
	// 或传空值（-Ploom.eclipseP2Mirror=）强制走官方源。
	// 只影响下载地址，不改变任何格式化规则或产物内容。
	def eclipseP2Mirror = providers.gradleProperty('loom.eclipseP2Mirror').getOrElse(
			'https://mirror.kakao.com/eclipse/eclipse/updates/4.35/R-4.35-202502280140')
	// greclipse 的 P2 模型含两个仓库，spotless 要求**每个**仓库都有镜像条目。
	// Groovy 那个仓库本身可达（返回正常的 p2.index），所以镜像指向它自己；
	// 只有 Eclipse 平台那个需要换到可达的副本。
	def groovyP2Repo = 'https://groovy.jfrog.io/artifactory/plugins-release/org/codehaus/groovy/groovy-eclipse-integration'
	def eclipseP2Mirrors = eclipseP2Mirror.isEmpty() ? [:] : [
		// 键要写到版本号为止：spotless 是「前缀替换 + 剩余路径原样追加」，
		// 键只写到 /updates 时剩余路径会带 /4.35 再拼一次，落到不存在的 .../R-.../4.35/。
		'https://download.eclipse.org/eclipse/updates/4.35': eclipseP2Mirror,
		(groovyP2Repo): groovyP2Repo,
	]

	java {
		licenseHeaderFile(rootProject.file("HEADER")).yearSeparator("-")
		targetExclude("**/loom/util/DownloadUtil.java", "**/loom/util/FileSystemUtil.java")
		targetExclude("**/dev/architectury/**")
	}

	groovy {
		importOrder('java', 'javax', '', 'net.fabricmc', '\\#')
		licenseHeaderFile(rootProject.file("HEADER")).yearSeparator("-")
		greclipse().withP2Mirrors(eclipseP2Mirrors)
	}

	groovyGradle {
		target 'src/**/*.gradle', '*.gradle'
		greclipse().withP2Mirrors(eclipseP2Mirrors)

		targetExclude(
				// These files use a @MAPPINGS@ token which is not valid Groovy
				'**/projects/forge/simple/build.gradle',
				'**/projects/neoforge/1202/build.gradle'
				)
	}

	kotlin {
		licenseHeaderFile(rootProject.file("HEADER")).yearSeparator("-")
		targetExclude("**/build.gradle.kts")
		targetExclude("src/test/resources/projects/*/**")
		ktlint()
	}
}

