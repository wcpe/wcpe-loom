/**
 * Replaces invalid characters in test names for GitHub Actions artifacts.
 */
abstract class PrintActionsTestName extends DefaultTask {
	@Input
	@Option(option = "name", description = "The test name")
	String testName

	@TaskAction
	def run() {
		def sanitised = testName.replace('*', '_')
		new File(System.getenv().GITHUB_OUTPUT) << "\ntest=$sanitised"
	}
}

abstract class DownloadGradleSources extends DefaultTask {
	@Classpath
	abstract ConfigurableFileCollection getGradleApi()

	@Input
	abstract Property<String> getGradleVersion()

	@TaskAction
	def run() {
		// Awful hack to find the gradle api location
		def gradleApiFile = gradleApi.files.find {
			it.name.startsWith("gradle-api")
		}

		if (gradleApiFile == null) {
			throw new GradleException("Unable to find Gradle API jar")
		}

		def gradleApiSources = new File(gradleApiFile.absolutePath.replace(".jar", "-sources.jar"))
		def url = "https://services.gradle.org/distributions/gradle-${gradleVersion.get()}-src.zip"

		gradleApiSources.delete()

		println("Downloading (${url}) to (${gradleApiSources})")
		gradleApiSources.withOutputStream { output ->
			new URI(url).toURL().withInputStream { input ->
				output << input
			}
		}
	}
}

/**
 * Outputs a json file with a list of all the tests to run in GitHub Actions.
 */
abstract class WriteActionsTestMatrix extends DefaultTask {
	@InputDirectory
	@PathSensitive(PathSensitivity.RELATIVE)
	abstract DirectoryProperty getIntegrationTestDirectory()

	@OutputFile
	abstract RegularFileProperty getOutputFile()

	@Input
	abstract Property<Boolean> getExtendedTests()

	@TaskAction
	def run() {
		def testMatrix = []

		// Arch: read tests from subdirs
		// Subdirectories combined into one test run each
		// pipeline/ 收的是 Minecraft jar 生产任务化（L3/L4）的等价性与冷缓存用例，
		// 它们守护的是「产物与配置期逐条目一致」这类核心正确性，必须进 CI 才有意义。
		//
		// 放 mergedSubdirs 而不是 directSubdirs 是有意的：同一次 Gradle test 调用里这些用例
		// 共用 TestKit 的 gradle_home，只有第一个付冷启动成本（CI 未缓存 caches/fabric-loom，
		// 现有的 forge / neoforge 用例本来也要冷建工具链），拆成独立矩阵项反而会各付一次。
		def mergedSubdirs = [
			'architectury',
			'neoforge'
			// 'pipeline' 已移出：它单独走下面的前缀分组，拆成多个矩阵项以缩短关键路径。
		]
		// Subdirectories where individual tests are added to the matrix (= longer tests)
		def directSubdirs = ['forge']

		integrationTestDirectory.get().asFile.eachFile {
			if (it.name.endsWith("Test.groovy")) {
				if (it.name.endsWith("ReproducibleBuildTest.groovy")) {
					// This test gets a special case to run across all os's
					return
				}

				if (it.name.endsWith("DebugLineNumbersTest.groovy") && !extendedTests.get()) {
					// Known flakey test
					return
				}

				if (it.name.endsWith("FabricAPITest.groovy")) {
					// Arch: Disabled as it hangs
					//
					// 维持禁用的决策（2026-10 复核，勿反复讨论）：它构建整条真实 fabric-api
					// （nightly Gradle、git clone 无 --depth、含真实起服，@Timeout 30 分钟 ×2 迭代），
					// 单类最坏 60 分钟，且超时后残留子进程会表现为"任务迟迟不结束"而非失败。
					//
					// 它过去是唯一能覆盖「mod jar 重映射的覆写传播」的用例（1.17.11 的 P0 回归正是
					// 漏在这一处），但该覆盖面已由针对性用例接管：
					// pipeline/RemapModsTaskEquivalenceTest（覆写方法名 + 负对照）。
					// 即：真正的洞已被更便宜、更精确的用例堵住，不必用这个重型用例来兜。
					return
				}

				def className = it.name.replace(".groovy", "")
				testMatrix.add("net.fabricmc.loom.test.integration.${className}")
			} else if (it.name.endsWith("noRemap")) {
				testMatrix.add("net.fabricmc.loom.test.integration.noRemap.*")
			} else if (it.isDirectory()) {
				if (it.name == 'pipeline') {
					// pipeline 有 23 个类，早先整体塞进一个矩阵项（pipeline.*），实测独占 26.3 分钟——
					// 它一个人就决定了整条流水线的最短墙钟，其它 65 个作业再怎么并行都得等它。
					//
					// 当初合并的理由是「共用 TestKit 的 gradle_home，只有第一个付冷启动成本」。
					// 现在 gradle_home 的关键目录（modules-2 / wrapper/dists /
					// caches/fabric-loom/minecraftMaven）都已进 actions/cache，
					// 冷启动成本由缓存吸收，这个理由不再成立。
					//
					// 按类名前缀拆成 4 个互不重叠的组，其余 5 个无前缀的类逐个成项。
					// Gradle 的 --tests 支持通配符，因此不需要改工作流里那条 --tests 调用。
					//
					// Forge 一族刻意**不拆**：这些 *Equivalence 用例会先把共享缓存里的产物
					// 移到 build/gold-backup 再整链重建，用例之间存在隐含的先后依赖。
					// 实测拆成 ForgePatched* / ForgeBinpatcher* / ForgeTool* 独立作业后，
					// 三个作业都以 NoSuchFileException 失败：
					//   .../caches/fabric-loom/1.20.1/.../mappings-srg-migrated.tiny
					// 保留在同一个作业里按原顺序执行即正常（run #143 通过、run #145 失败）。
					testMatrix.add("net.fabricmc.loom.test.integration.pipeline.Forge*")
					testMatrix.add("net.fabricmc.loom.test.integration.pipeline.ProcessMinecraftJar*")
					testMatrix.add("net.fabricmc.loom.test.integration.pipeline.Remap*")
					testMatrix.add("net.fabricmc.loom.test.integration.pipeline.Srg*")

					// 未被上述前缀覆盖的类（FabricSplitRemap / MinecraftJarTaskWiring /
					// ModSourcesColdCache / SplitModDependencyProducer / ZipFsCloseRaceHeal）
					// 逐个成项；新增类若落入已覆盖前缀会自动归组，若不带这些前缀则自动单项，
					// 不需要维护名单。
					def coveredPrefixes = [
						'Forge',
						'ProcessMinecraftJar',
						'Remap',
						'Srg'
					]

					it.eachFile { child ->
						if (!child.name.endsWith('.groovy')) {
							return
						}

						def className = child.name.replace('.groovy', '')

						if (!coveredPrefixes.any { className.startsWith(it) }) {
							testMatrix.add("net.fabricmc.loom.test.integration.pipeline.${className}")
						}
					}
				} else if (mergedSubdirs.contains(it.name)) {
					testMatrix.add("net.fabricmc.loom.test.integration.${it.name}.*")
				} else if (directSubdirs.contains(it.name)) {
					it.eachFile { child ->
						if (child.isDirectory()) {
							// 二级目录中的测试同样逐个成组
							child.eachFile { nested ->
								def nestedName = nested.name.replace(".groovy", "")
								testMatrix.add("net.fabricmc.loom.test.integration.${it.name}.${child.name}.${nestedName}")
							}
						} else {
							def className = child.name.replace(".groovy", "")
							testMatrix.add("net.fabricmc.loom.test.integration.${it.name}.${className}")
						}
					}
				}
			}
		}

		// Run all the unit tests together
		testMatrix.add("net.fabricmc.loom.test.unit.*")

		def output = outputFile.get().asFile
		output.parentFile.mkdir()
		output.text = groovy.json.JsonOutput.toJson(testMatrix)
	}
}

apply from: rootProject.file('gradle/versions.gradle')
apply from: rootProject.file('gradle/package-info.gradle')
